<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフライン - ユニバで食べたものリスト</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      section { max-width: 420px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { line-height: 1.7; color: #475569; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>オフラインです</h1>
        <p>通信が戻ると、フード一覧と記録を再度確認できます。すでに開いたページはキャッシュから表示される場合があります。</p>
      </section>
    </main>
  </body>
</html>
