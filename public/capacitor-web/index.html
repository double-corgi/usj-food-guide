<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18212f" />
    <title>ユニバフード制覇</title>
    <style>
      :root {
        color: #18212f;
        background: #fffaf5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 420px;
        border: 1px solid rgba(24, 33, 47, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
        padding: 28px;
      }

      p {
        line-height: 1.75;
        margin: 12px 0 0;
      }

      .label {
        color: #007a5a;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        font-size: 26px;
        line-height: 1.2;
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Mobile Shell</div>
      <h1>ユニバフード制覇</h1>
      <p>
        この画面はCapacitor同期用の最小フォールバックです。iOS / Androidアプリとして表示する場合は、
        <code>CAPACITOR_SERVER_URL</code> に本番公開URLを設定して同期してください。
      </p>
    </main>
  </body>
</html>
